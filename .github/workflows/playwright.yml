name: Playwright Tests

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            grep:
                description: 'Test tag to run (e.g. @TC-002). Leave empty to run all.'
                required: false
                default: ''
                type: string
            workers:
                description: 'Number of workers (e.g. 1 to 4). Leave empty for default.'
                required: false
                default: ''
                type: string

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: read
        container:
            image: mcr.microsoft.com/playwright:v1.60.0-noble
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Run Playwright tests
              run: |
                  EXIT_CODE=0
                  
                  WORKERS_FLAG=""
                  if [ -n "$WORKERS_INPUT" ]; then
                      WORKERS_FLAG="--workers=$WORKERS_INPUT"
                  fi
                  
                  if [ -n "$TEST_GREP" ]; then
                      npx playwright test --grep "$TEST_GREP" $WORKERS_FLAG --reporter=list,html,json || EXIT_CODE=$?
                  else
                      npx playwright test $WORKERS_FLAG --reporter=list,html,json || EXIT_CODE=$?
                  fi
                  
                  if [ -f "test-results.json" ]; then
                      PASSED=$(jq -r '.stats.expected' test-results.json)
                      FAILED=$(jq -r '.stats.unexpected' test-results.json)
                      FLAKY=$(jq -r '.stats.flaky' test-results.json)
                      SKIPPED=$(jq -r '.stats.skipped // 0' test-results.json)
                      TOTAL=$((PASSED + FAILED + FLAKY + SKIPPED))
                      RATE=0
                      if [ "$TOTAL" -gt 0 ]; then
                          RATE=$(( (PASSED * 100) / TOTAL ))
                      fi
                      
                      echo "### 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
                      if [ -n "$TEST_GREP" ]; then
                          echo "**Target:** Filtered by \`$TEST_GREP\`" >> $GITHUB_STEP_SUMMARY
                      else
                          echo "**Target:** All tests" >> $GITHUB_STEP_SUMMARY
                      fi
                      echo "" >> $GITHUB_STEP_SUMMARY
                      echo "| Total | Passed | Failed | Flaky | Skipped | Pass Rate |" >> $GITHUB_STEP_SUMMARY
                      echo "|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
                      echo "| $TOTAL | 🟢 $PASSED | 🔴 $FAILED | 🟡 $FLAKY | ⚪ $SKIPPED | **$RATE%** |" >> $GITHUB_STEP_SUMMARY
                  else
                      echo "### 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
                      echo "🔴 **Error:** No tests found or execution failed." >> $GITHUB_STEP_SUMMARY
                      if [ -n "$TEST_GREP" ]; then
                          echo "Please check if the tag \`$TEST_GREP\` exists." >> $GITHUB_STEP_SUMMARY
                      fi
                  fi
                  
                  exit $EXIT_CODE
              env:
                  TEST_GREP: ${{ inputs.grep }}
                  WORKERS_INPUT: ${{ inputs.workers }}
                  PLAYWRIGHT_JSON_OUTPUT_NAME: test-results.json

            - name: Upload Playwright Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30

    deploy:
        needs: test
        if: always()
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: 'pages'
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download test results
              uses: actions/download-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload to GitHub Pages
              uses: actions/upload-pages-artifact@v3
              with:
                  path: playwright-report/

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
